# Roda os testes a cada envio, com o modelo simulado: não chama nenhum modelo, não custa nada
# e não guarda nenhum segredo. Actions fixadas pelo commit (SHA), conferidas em 2026-11-16;
# o Dependabot propõe as atualizações.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Testes (modelo simulado; a página do Planalto não está no repositório, então um teste fica de fora)
        run: python -m unittest -v
      - name: Busca contra os gabaritos (sem modelo)
        run: |
          python -m lgpd_rag.avaliar gabarito/desenvolvimento.jsonl
          python -m lgpd_rag.avaliar gabarito/final2.jsonl

  seguranca:
    name: vulnerabilidades e segredos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (dependências, configuração e segredos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
